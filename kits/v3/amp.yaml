# syntax=docker/sandbox-kit:3.0.0-m.11@sha256:adbc0d1ea63451871d5d78111120bb29f2fd2b265e63d39c664ae2c3d722c805
schemaVersion: "3"
kind: workload
version: "0.1.0"
displayName: Amp Factory v3
description: Example Amp workload with portable OCI toolchain image.
# Kit 0.1.0 is not the upstream Amp binary version; Amp currently floats.
sourceUrl: https://github.com/nextexcite/sbx-agent-kits
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ampcode.com:443
          - '*.ampcode.com:443'
          - github.com:443
          - api.github.com:443
          - '*.githubusercontent.com:443'
          - registry.npmjs.org:443
          - pypi.org:443
          - files.pythonhosted.org:443
  - type: com.docker.sandbox/credential@1
    name: Amp API access
    optional: true
    config:
      service: amp
      phase: runtime
      apiKey:
        name: AMP_API_KEY
        proxyManaged: true
        inject:
          - {domain: ampcode.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./amp-context.md
dockerfile: amp.dockerfile
